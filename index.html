<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<main class="game">
  <header>
    <div class="brand">
      <h1>2048</h1>
      <p>Join the tiles. Reach 2048.</p>
    </div>
    <div class="scores">
      <div class="score"><span id="score">0</span><small>score</small></div>
      <div class="score"><span id="best">0</span><small>best</small></div>
    </div>
  </header>

  <div class="toolbar">
    <button id="newBtn" type="button">New game</button>
    <p id="status">Use the arrow keys or swipe.</p>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="2048 board"></div>
    <div class="overlay" id="overlay" hidden>
      <p id="overlayText">Game over</p>
      <button id="againBtn" type="button">Try again</button>
    </div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
